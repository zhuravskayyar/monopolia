<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Монополія — облік власності</title>
<style>
* {
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #2c3e50;
    padding: 10px;
    margin: 0;
    min-height: 100vh;
}

h1, h2, h3 {
    text-align: center;
    margin-top: 0;
    word-wrap: break-word;
}

h1 {
    color: white;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    padding: 15px;
    font-size: 1.8em;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.container {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1600px;
    margin: 0 auto;
}

.box {
    border: none;
    padding: 20px;
    background: rgba(255, 255, 255, 0.95);
    min-width: 320px;
    flex: 1;
    max-width: 500px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
}

.box-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 3px solid;
    border-radius: 0 0 10px 10px;
}

.box-header.streets { border-color: #4CAF50; }
.box-header.railroads { border-color: #795548; }
.box-header.utilities { border-color: #2196F3; }
.box-header.players { border-color: #FF9800; }
.box-header.cards { border-color: #9C27B0; }

.box-header-icon {
    font-size: 1.5em;
}

button {
    font-family: inherit;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    padding: 12px 20px;
    cursor: pointer;
    color: white;
    border-radius: 12px;
    margin: 5px;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    font-size: 0.95em;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
}

button:active {
    transform: translateY(0);
}

button.secondary {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
}

button.danger {
    background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
    box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
}

button.success {
    background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
    box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
}

button.warning {
    background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
    box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
}

button.small {
    padding: 8px 15px;
    font-size: 0.85em;
    width: auto;
}

select, input {
    font-family: inherit;
    color: #2c3e50;
    border: 2px solid #e0e0e0;
    padding: 12px 15px;
    border-radius: 12px;
    margin: 5px 0;
    width: 100%;
    background: white;
    font-size: 0.95em;
    transition: border-color 0.3s;
}

select:focus, input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.card {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: none;
    background: white;
    padding: 25px;
    z-index: 1000;
    min-width: 90%;
    max-width: 600px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    border-radius: 25px;
    text-align: center;
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translate(-50%, -40%);
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%);
    }
}

.hidden { 
    display: none; 
}

.property-item {
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 15px;
    transition: all 0.3s ease;
    background: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    border-left: 5px solid;
    position: relative;
    overflow: hidden;
}

.property-item:hover {
    transform: translateX(5px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}

.property-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--property-color), transparent);
}

.property-name {
    font-weight: 700;
    color: #2c3e50;
    font-size: 1.2em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.property-icon {
    font-size: 1.3em;
    margin-right: 10px;
}

.owner-badge {
    font-size: 0.85em;
    margin: 8px 0;
    padding: 6px 12px;
    border-radius: 20px;
    display: inline-block;
    font-weight: 600;
}

.property-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin: 15px 0;
    font-size: 0.95em;
}

.property-info-item {
    padding: 8px;
    background: #f8f9fa;
    border-radius: 10px;
    text-align: center;
}

.property-info-value {
    font-weight: 700;
    color: #667eea;
    font-size: 1.1em;
    margin-top: 5px;
}

.rent-info {
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    padding: 15px;
    border-radius: 12px;
    margin: 15px 0;
    border-left: 4px solid #667eea;
}

.rent-amount {
    font-size: 1.4em;
    font-weight: 800;
    color: #2c3e50;
    display: block;
    margin: 10px 0;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 2px dashed #e0e0e0;
}

.controls-column {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-width: 200px;
}

.house-controls {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 15px;
    padding: 15px;
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    border-radius: 12px;
    flex-wrap: wrap;
}

.house-count {
    font-weight: 800;
    color: #2c3e50;
    font-size: 1.3em;
    display: flex;
    align-items: center;
    gap: 5px;
}

.house-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.player-item {
    margin: 12px 0;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
}

.player-item:hover {
    transform: translateX(5px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}

.player-color {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    flex-shrink: 0;
}

.player-inputs {
    display: flex;
    flex: 1;
    gap: 10px;
    flex-wrap: wrap;
}

.player-inputs input {
    flex: 1;
    min-width: 120px;
}

.remove-player {
    background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
    color: white;
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.3s ease;
}

.remove-player:hover {
    transform: scale(1.1);
}

.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 999;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.monopoly-badge {
    background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
    color: #2c3e50;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: 800;
    margin-left: 10px;
    animation: pulse 2s infinite;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.mortgage-badge {
    background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: 800;
    margin-left: 10px;
}

.tab-buttons {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
    justify-content: center;
}

.tab-button {
    flex: 1;
    min-width: 140px;
    padding: 15px;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-weight: 600;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.tab-button:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
}

.tab-button.active {
    background: white;
    color: #667eea;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.mobile-menu {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    padding: 15px;
    z-index: 100;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
    border-radius: 25px 25px 0 0;
}

.mobile-menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.mobile-menu button {
    padding: 12px;
    font-size: 0.85em;
    margin: 0;
}

.dice-roller {
    background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    color: white;
    text-align: center;
}

.dice-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
}

.dice {
    width: 60px;
    height: 60px;
    background: white;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    font-weight: 800;
    color: #2c3e50;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    animation: diceRoll 1s ease;
}

@keyframes diceRoll {
    0% { transform: rotate(0deg) scale(0.5); }
    50% { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin: 20px 0;
}

.stat-card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    text-align: center;
    transition: all 0.3s ease;
}

.stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.stat-value {
    font-size: 2em;
    font-weight: 800;
    color: #667eea;
    margin: 10px 0;
}

.stat-label {
    color: #7f8c8d;
    font-size: 0.9em;
}

.save-notification {
    position: fixed;
    bottom: 100px;
    right: 20px;
    background: #4CAF50;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    z-index: 1000;
    animation: slideInRight 0.3s ease;
    display: none;
}

@keyframes slideInRight {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

.auto-save-indicator {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.9);
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 0.8em;
    color: #666;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    display: none;
    align-items: center;
    gap: 8px;
}

@media (max-width: 768px) {
    .container {
        flex-direction: column;
        gap: 10px;
    }
    
    .box {
        width: 100%;
        max-width: 100%;
        padding: 15px;
        margin-bottom: 10px;
    }
    
    h1 {
        font-size: 1.4em;
        padding: 12px;
    }
    
    button {
        padding: 10px 15px;
        font-size: 0.9em;
    }
    
    .mobile-menu {
        display: block;
    }
    
    .desktop-only {
        display: none;
    }
    
    .property-info {
        grid-template-columns: 1fr;
    }
    
    .controls-column {
        min-width: 100%;
    }
    
    .tab-button {
        min-width: 120px;
        padding: 12px;
    }
    
    .card {
        padding: 20px;
        min-width: 95%;
        max-height: 90vh;
    }
    
    .save-notification {
        bottom: 80px;
        right: 10px;
        left: 10px;
        text-align: center;
    }
    
    .auto-save-indicator {
        top: 10px;
        right: 10px;
        left: 10px;
        justify-content: center;
    }
}

@media (min-width: 769px) {
    .mobile-menu {
        display: none;
    }
}

/* v2 — компактний мобільний інтерфейс для гри за столом */
:root {
    --ink: #17201c;
    --muted: #66716b;
    --paper: #f7f4ed;
    --panel: #fffdf8;
    --line: #ded8cc;
    --green: #194f3b;
    --green-2: #2f7657;
    --gold: #d6a84b;
    --danger: #9d3f3f;
}

body {
    background: #18392f;
    background-image: radial-gradient(circle at 15% 0%, #2b5b49 0, transparent 34%), linear-gradient(160deg, #153229 0%, #0d211b 100%);
    color: var(--ink);
    padding: 0 12px 96px;
}

.header { max-width: 980px; margin: 0 auto; }
h1 {
    background: transparent;
    border: 0;
    box-shadow: none;
    backdrop-filter: none;
    text-align: left;
    padding: 22px 4px 8px;
    margin: 0;
    font-size: clamp(1.35rem, 5vw, 2rem);
    letter-spacing: -.03em;
}
h1 small { display: block; margin-top: 4px; font-size: .48em; font-weight: 500; color: #c6d6cf; letter-spacing: 0; }

.tab-buttons {
    max-width: 980px;
    margin: 8px auto 14px;
    flex-wrap: nowrap;
    justify-content: flex-start;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 0 7px;
}
.tab-buttons::-webkit-scrollbar { display: none; }
.tab-button {
    min-width: max-content;
    flex: 0 0 auto;
    padding: 10px 14px;
    margin: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.09);
    border-color: rgba(255,255,255,.13);
    box-shadow: none;
}
.tab-button.active { color: var(--green); background: var(--paper); box-shadow: 0 5px 18px rgba(0,0,0,.18); }
.tab-button .box-header-icon { font-size: 1em; }

.container { max-width: 980px; gap: 14px; align-items: flex-start; }
.box {
    background: var(--paper);
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 22px;
    padding: 14px;
    min-width: 0;
    max-width: 620px;
    box-shadow: 0 16px 40px rgba(0,0,0,.22);
}
.box-header { justify-content: space-between; margin: 0 2px 12px; padding: 3px 2px 11px; border-width: 1px; }
.box-header h2 { margin: 0; font-size: 1.15rem; }
.box-header .box-header-icon { display: none; }

.property-tools { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 12px; }
.property-tools input, .property-tools select { margin: 0; min-height: 44px; border: 1px solid var(--line); background: var(--panel); }
.filter-row { display: flex; gap: 6px; overflow-x: auto; grid-column: 1 / -1; padding-bottom: 2px; }
.filter-chip { width: auto; min-width: max-content; margin: 0; padding: 8px 12px; border-radius: 999px; background: #e8e5dc; color: #4a544f; box-shadow: none; }
.filter-chip.active { background: var(--green); color: white; }

.property-item {
    margin-bottom: 8px;
    padding: 0;
    border: 1px solid var(--line);
    border-left: 7px solid;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(25,39,32,.07);
    overflow: hidden;
    background: var(--panel);
}
.property-item:hover { transform: none; box-shadow: 0 3px 12px rgba(25,39,32,.1); }
.property-item::before { display: none; }
.property-summary { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 12px; cursor: pointer; }
.property-title { min-width: 0; }
.property-name { margin: 0 0 5px; font-size: 1rem; line-height: 1.2; justify-content: flex-start; gap: 6px; }
.property-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: .8rem; }
.property-rent { min-width: 70px; text-align: right; }
.property-rent strong { display: block; color: var(--green); font-size: 1.1rem; }
.property-rent span { color: var(--muted); font-size: .7rem; text-transform: uppercase; }
.owner-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.property-details { display: none; padding: 0 12px 12px; border-top: 1px solid #ece7dc; }
.property-item.open .property-details { display: block; }
.property-item.mortgaged { opacity: .67; filter: saturate(.55); }
.property-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
.property-actions button, .property-actions select { margin: 0; min-height: 42px; }
.property-actions .wide { grid-column: 1 / -1; }
.quick-houses { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.quick-houses button { width: 42px; height: 42px; padding: 0; margin: 0; border-radius: 12px; }
.quick-houses .house-state { flex: 1; text-align: center; font-weight: 700; }
.monopoly-badge, .mortgage-badge { animation: none; margin: 0; font-size: .65rem; padding: 3px 7px; }

button { background: var(--green); box-shadow: none; border-radius: 11px; }
button:hover { transform: none; box-shadow: none; }
button.secondary { background: #69537c; box-shadow: none; }
button.success { background: var(--green-2); box-shadow: none; }
button.warning { background: #a46c27; box-shadow: none; }
button.danger { background: var(--danger); box-shadow: none; }
button:disabled { opacity: .38; cursor: not-allowed; }
.total-value { color: var(--muted); }
.stat-card { background: var(--panel); box-shadow: none; border: 1px solid var(--line); padding: 12px; }
.stat-value { color: var(--green); }

.mobile-menu { background: rgba(20,39,32,.96); backdrop-filter: blur(14px); border-radius: 18px 18px 0 0; padding: 10px max(10px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.mobile-menu-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
.mobile-menu button { background: transparent; padding: 7px 3px; font-size: .7rem; flex-direction: column; gap: 3px; }
.mobile-menu button span { font-size: 1.35rem; }
.mobile-menu button.active { background: rgba(255,255,255,.12); }
.mobile-menu .desktop-action { display: none; }

.card { background: var(--paper); border-radius: 22px; padding: 20px; }
.overlay { backdrop-filter: blur(4px); }

@media (max-width: 768px) {
    body { padding-left: 8px; padding-right: 8px; }
    .box { padding: 10px; border-radius: 18px; }
    .tab-buttons { display: none; }
    .property-info, .rent-info, .controls, .house-controls { margin: 8px 0; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-value { font-size: 1.35rem; }
}
</style>
</head>

<body>

<div class="header">
    <h1>Монополія <small>Швидкий облік власності під час гри</small></h1>
</div>

<div class="auto-save-indicator" id="autoSaveIndicator">
    <span class="save-icon">💾</span>
    <span class="save-text">Автозбереження...</span>
</div>

<div class="tab-buttons">
    <button class="tab-button active" onclick="switchTab('streets')">
        <span class="box-header-icon">🏘️</span> Вулиці
    </button>
    <button class="tab-button" onclick="switchTab('railroads')">
        <span class="box-header-icon">🚂</span> Вокзали
    </button>
    <button class="tab-button" onclick="switchTab('utilities')">

// Поточні дані гри
let properties = [];
let railroads = [];
let utilities = [];

// Ініціалізація
function init() {
    // Перевіряємо, чи є збережена гра
    if (hasSavedGame()) {
        showLoadGamePrompt();
    } else {
        startNewGame();
    }
}

// Перевірка наявності збереженої гри
function hasSavedGame() {
    const savedPlayers = localStorage.getItem(STORAGE_KEYS.PLAYERS);
    const savedProperties = localStorage.getItem(STORAGE_KEYS.PROPERTIES);
    const savedVersion = localStorage.getItem(STORAGE_KEYS.GAME_VERSION);
    
    // Старі збереження сумісні: версія більше не видаляє прогрес.
    return savedPlayers && savedProperties;
}

// Показати запит на завантаження гри
function showLoadGamePrompt() {
    const lastSaved = localStorage.getItem(STORAGE_KEYS.LAST_SAVED);
    const lastSavedText = lastSaved ? `(останнє збереження: ${new Date(parseInt(lastSaved)).toLocaleString()})` : '';
    
    const content = `
        <div style="text-align: left; padding: 20px;">
            <h3>💾 Знайдено збережену гру!</h3>
            <div style="margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 10px;">
                ${lastSavedText}
            </div>
            <div style="display: flex; gap: 15px; margin-top: 25px;">
                <button onclick="loadGame(); closeCard();" style="flex: 1; padding: 15px; background: #4CAF50; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">
                    📂 Завантажити гру
                </button>
                <button onclick="startNewGame(); closeCard();" style="flex: 1; padding: 15px; background: #ff9800; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">
                    🆕 Почати нову
                </button>
            </div>
        </div>
    `;
    
    showCard('Завантажити збережену гру?', content);
}

// Почати нову гру
function startNewGame() {
    // Створюємо нову гру
    players = [
        {name: "Гравець 1", color: "#FF6B6B", money: 1500},
        {name: "Гравець 2", color: "#4ECDC4", money: 1500}
    ];
    
    transportCardsUsed = [];
    
    // Копіюємо шаблони
    properties = JSON.parse(JSON.stringify(propertyTemplates));
    railroads = JSON.parse(JSON.stringify(railroadTemplates));
    utilities = JSON.parse(JSON.stringify(utilityTemplates));
    transportCards = JSON.parse(JSON.stringify(transportCardTemplates));
    
    // Скидаємо власність
    properties.forEach(prop => {
        prop.owner = null;
        prop.houses = 0;
        prop.mortgaged = false;
    });
    
    railroads.forEach(rr => {
        rr.owner = null;
        rr.mortgaged = false;
    });
    
    utilities.forEach(util => {
        util.owner = null;
        util.mortgaged = false;
    });
    
    renderPlayers();
    updateGame();
    populateRentCalculator();
    switchTab('streets');
    
    // Зберігаємо нову гру
    saveGame();
    showSaveNotification('Нова гра створена та збережена!');
}

// Завантажити гру
function loadGame() {
    try {
        // Завантажуємо гравців
        const savedPlayers = localStorage.getItem(STORAGE_KEYS.PLAYERS);
        if (savedPlayers) {
            players = JSON.parse(savedPlayers);
        }
        
        // Завантажуємо вулиці
        const savedProperties = localStorage.getItem(STORAGE_KEYS.PROPERTIES);
        if (savedProperties) {
            properties = JSON.parse(savedProperties);
            properties.forEach(prop => { prop.mortgaged = Boolean(prop.mortgaged); });
        }
        
        // Завантажуємо вокзали
        const savedRailroads = localStorage.getItem(STORAGE_KEYS.RAILROADS);
        if (savedRailroads) {
            railroads = JSON.parse(savedRailroads);
        }
        
        // Завантажуємо комунікації
        const savedUtilities = localStorage.getItem(STORAGE_KEYS.UTILITIES);
        if (savedUtilities) {
            utilities = JSON.parse(savedUtilities);
        }
        
        // Завантажуємо транспортні карти
        const savedTransportCards = localStorage.getItem(STORAGE_KEYS.TRANSPORT_CARDS);
        if (savedTransportCards) {
            transportCardsUsed = JSON.parse(savedTransportCards);
        }
        
        // Оновлюємо шаблони карт
        transportCards = JSON.parse(JSON.stringify(transportCardTemplates));
        
        renderPlayers();
        updateGame();
        populateRentCalculator();
        switchTab('streets');
        
        showSaveNotification('Гра завантажена!');
        
        // Оновлюємо індикатор автозбереження
        const lastSaved = localStorage.getItem(STORAGE_KEYS.LAST_SAVED);
        if (lastSaved) {
            updateAutoSaveIndicator(new Date(parseInt(lastSaved)));
        }
        
    } catch (error) {
        console.error('Помилка завантаження гри:', error);
        alert('Помилка завантаження гри. Почати нову гру?');
        startNewGame();
    }
}

// Зберегти гру
function saveGame() {
    try {
        // Зберігаємо всі дані
        localStorage.setItem(STORAGE_KEYS.PLAYERS, JSON.stringify(players));
        localStorage.setItem(STORAGE_KEYS.PROPERTIES, JSON.stringify(properties));
        localStorage.setItem(STORAGE_KEYS.RAILROADS, JSON.stringify(railroads));
        localStorage.setItem(STORAGE_KEYS.UTILITIES, JSON.stringify(utilities));
        localStorage.setItem(STORAGE_KEYS.TRANSPORT_CARDS, JSON.stringify(transportCardsUsed));
        localStorage.setItem(STORAGE_KEYS.LAST_SAVED, Date.now().toString());
        localStorage.setItem(STORAGE_KEYS.GAME_VERSION, GAME_VERSION);
        
        // Показуємо індикатор автозбереження
        showAutoSaveIndicator();
        
    } catch (error) {
        console.error('Помилка збереження гри:', error);
    }
}

// Ручне збереження гри
function saveGameManually() {
    saveGame();
    showSaveNotification('Гра збережена вручну!');
}

// Очистити збережену гру
function clearSavedGame() {
    Object.values(STORAGE_KEYS).forEach(key => {
        localStorage.removeItem(key);
    });
}

// Показати індикатор автозбереження
function showAutoSaveIndicator() {
    const indicator = document.getElementById('autoSaveIndicator');
    const saveText = indicator.querySelector('.save-text');
    
    saveText.textContent = 'Автозбереження...';
    indicator.style.display = 'flex';
    
    // Анімація
    setTimeout(() => {
        saveText.textContent = 'Збережено!';
        setTimeout(() => {
            indicator.style.display = 'none';
        }, 1000);
    }, 500);
}

// Оновити індикатор автозбереження
function updateAutoSaveIndicator(lastSaveDate) {
    const now = new Date();
    const diffMs = now - lastSaveDate;
    const diffMins = Math.floor(diffMs / 60000);
    
    let text;
    if (diffMins < 1) {
        text = 'Збережено щойно';
    } else if (diffMins < 60) {
        text = `Збережено ${diffMins} хв тому`;
    } else if (diffMins < 1440) {
        const hours = Math.floor(diffMins / 60);
        text = `Збережено ${hours} год тому`;
    } else {
        const days = Math.floor(diffMins / 1440);
        text = `Збережено ${days} дн тому`;
    }
    
    const indicator = document.getElementById('autoSaveIndicator');
    const saveText = indicator.querySelector('.save-text');
    
    saveText.textContent = text;
    indicator.style.display = 'flex';
    
    // Ховаємо через 5 секунд
    setTimeout(() => {
        indicator.style.display = 'none';
    }, 5000);
}

// Показати сповіщення про збереження
function showSaveNotification(message) {
    const notification = document.getElementById('saveNotification');
    notification.textContent = message || '💾 Гра збережена!';
    notification.style.display = 'block';
    
    setTimeout(() => {
        notification.style.display = 'none';
    }, 3000);
}

// Перемикання вкладок
function switchTab(tabName) {
    // Оновлюємо кнопки вкладок
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
    });
    
    const tabs = ['streets', 'railroads', 'utilities', 'players', 'actions'];
    const tabIndex = tabs.indexOf(tabName);
    if (tabIndex >= 0) {
        document.querySelectorAll('.tab-button')[tabIndex].classList.add('active');
    }
    document.querySelectorAll('.mobile-menu [data-tab]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
    });
    
    // Показуємо/ховаємо бокси
    const allBoxes = ['streets-box', 'railroads-box', 'utilities-box', 'players-box', 'actions-box'];
    allBoxes.forEach(box => {
        document.getElementById(box).style.display = 'none';
    });
    
    // Показуємо потрібні бокси
    if (tabName === 'streets') {
        document.getElementById('streets-box').style.display = 'block';
        document.getElementById('actions-box').style.display = window.innerWidth > 768 ? 'block' : 'none';
    } else if (tabName === 'railroads') {
        document.getElementById('railroads-box').style.display = 'block';
        document.getElementById('actions-box').style.display = window.innerWidth > 768 ? 'block' : 'none';
    } else if (tabName === 'utilities') {
        document.getElementById('utilities-box').style.display = 'block';
        document.getElementById('actions-box').style.display = window.innerWidth > 768 ? 'block' : 'none';
    } else if (tabName === 'players') {
        document.getElementById('players-box').style.display = 'block';
        document.getElementById('actions-box').style.display = window.innerWidth > 768 ? 'block' : 'none';
    } else if (tabName === 'actions') {
        document.getElementById('actions-box').style.display = 'block';
    }
}

// Відображення гравців
function renderPlayers() {
    const div = document.getElementById("players");
    div.innerHTML = "";
    
    players.forEach((player, index) => {
        div.innerHTML += `
            <div class="player-item">
                <div class="player-color" style="background-color: ${player.color}"></div>
                <div class="player-inputs">
                    <input value="${player.name}" onchange="renamePlayer(${index}, this.value)" placeholder="Ім'я гравця">
                    <input type="number" value="${player.money}" onchange="players[${index}].money=parseInt(this.value); updateGameAndSave()" placeholder="Гроші">
                </div>
                <button class="remove-player" onclick="removePlayer(${index})">×</button>
            </div>`;
    });
}

function renamePlayer(index, newName) {
    const cleanName = newName.trim();
    const oldName = players[index].name;
    if (!cleanName) { renderPlayers(); return alert('Імʼя гравця не може бути порожнім'); }
    if (players.some((player, playerIndex) => playerIndex !== index && player.name === cleanName)) {
        renderPlayers();
        return alert('Гравець із таким імʼям уже є');
    }
    [...properties, ...railroads, ...utilities].forEach(item => {
        if (item.owner === oldName) item.owner = cleanName;
    });
    players[index].name = cleanName;
    if (ownerFilter === oldName) ownerFilter = cleanName;
    updateGameAndSave();
}

// Додавання гравця
function addPlayer() {
    if (players.length >= 8) return alert("Максимум 8 гравців");
    
    const colors = ['#FF6B6B', '#4ECDC4', '#FFD166', '#06D6A0', '#118AB2', '#EF476F', '#7209B7', '#F15BB5'];
    const playerNum = players.length + 1;
    
    players.push({
        name: `Гравець ${playerNum}`,
        color: colors[players.length % colors.length],
        money: 1500
    });
    
    renderPlayers();
    updateGameAndSave();
    populateRentCalculator();
}

// Видалення гравця
function removePlayer(index) {
    if (confirm(`Видалити гравця ${players[index].name}? Усі його власності будуть звільнені.`)) {
        // Звільняємо вулиці
        properties.forEach(property => {
            if (property.owner === players[index].name) {
                property.owner = null;
                property.houses = 0;
            }
        });
        
        // Звільняємо вокзали
        railroads.forEach(railroad => {
            if (railroad.owner === players[index].name) {
                railroad.owner = null;
                railroad.mortgaged = false;
            }
        });
        
        // Звільняємо комунікації
        utilities.forEach(utility => {
            if (utility.owner === players[index].name) {
                utility.owner = null;
                utility.mortgaged = false;
            }
        });
        
        players.splice(index, 1);
        renderPlayers();
        updateGameAndSave();
        populateRentCalculator();
    }
}

const GROUP_NAMES = {brown:'Коричневі', lightblue:'Блакитні', pink:'Рожеві', orange:'Помаранчеві', red:'Червоні', yellow:'Жовті', green:'Зелені', blue:'Сині'};

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
}

function setPropertySearch(value) { propertySearch = value.trim().toLowerCase(); renderStreets(); }
function setOwnerFilter(value) { ownerFilter = value; renderStreets(); }
function setGroupFilter(value) { groupFilter = value; renderStreets(); }
function toggleProperty(index) { document.getElementById(`street-${index}`)?.classList.toggle('open'); }

function renderPropertyFilters() {
    const ownerSelect = document.getElementById('ownerFilter');
    const selected = ownerFilter;
    ownerSelect.innerHTML = `<option value="all">Усі власники</option><option value="free">Вільні</option>` +
        players.map(player => `<option value="${escapeHtml(player.name)}">${escapeHtml(player.name)}</option>`).join('');
    ownerSelect.value = [...ownerSelect.options].some(option => option.value === selected) ? selected : 'all';
    document.getElementById('groupFilters').innerHTML =
        `<button class="filter-chip ${groupFilter === 'all' ? 'active' : ''}" onclick="setGroupFilter('all')">Усі кольори</button>` +
        Object.entries(GROUP_NAMES).map(([key, name]) => `<button class="filter-chip ${groupFilter === key ? 'active' : ''}" onclick="setGroupFilter('${key}')">${name}</button>`).join('');
}

// Компактний список: головне видно одразу, дії відкриваються одним натисканням.
function renderStreets() {
    const div = document.getElementById('streets');
    renderPropertyFilters();
    const visible = properties.map((property, index) => ({property, index})).filter(({property}) => {
        const searchMatch = !propertySearch || property.name.toLowerCase().includes(propertySearch);
        const ownerMatch = ownerFilter === 'all' || (ownerFilter === 'free' ? !property.owner : property.owner === ownerFilter);
        return searchMatch && ownerMatch && (groupFilter === 'all' || property.group === groupFilter);
    });

    if (!visible.length) {
        div.innerHTML = `<div class="rent-info">Нічого не знайдено. Змініть фільтр або пошук.</div>`;
        return;
    }

    div.innerHTML = visible.map(({property, index}) => {
        const isMonopoly = checkMonopoly(property.group, property.owner);
        const ownerColor = property.owner ? getPlayerColor(property.owner) : '#9aa29e';
        const currentRent = calculateCurrentRent(property);
        const houseLabel = property.houses === 5 ? 'Готель' : `${property.houses} буд.`;
        const group = properties.filter(item => item.group === property.group);
        const minHouses = Math.min(...group.map(item => item.houses));
        const maxHouses = Math.max(...group.map(item => item.houses));
        const canBuild = isMonopoly && !property.mortgaged && property.houses < 5 && property.houses === minHouses;
        const canSell = property.houses > 0 && property.houses === maxHouses;
        return `
        <article id="street-${index}" class="property-item ${property.mortgaged ? 'mortgaged' : ''}" style="--property-color:${property.color};border-left-color:${property.color}">
            <div class="property-summary" onclick="toggleProperty(${index})">
                <div class="property-title">
                    <div class="property-name">${escapeHtml(property.name)} ${isMonopoly ? '<span class="monopoly-badge">МОНОПОЛІЯ</span>' : ''} ${property.mortgaged ? '<span class="mortgage-badge">ЗАКЛАДЕНО</span>' : ''}</div>
                    <div class="property-meta">
                        <span><i class="owner-dot" style="background:${ownerColor}"></i>${property.owner ? escapeHtml(property.owner) : 'Вільна'}</span>
                        <span>Ціна ${property.price} ₴</span>
                        ${property.houses ? `<span>${houseLabel}</span>` : ''}
                    </div>
                </div>
                <div class="property-rent"><span>оренда</span><strong>${currentRent} ₴</strong></div>
            </div>
            <div class="property-details">
                <div class="property-meta"><span>Будинок: ${property.houseCost} ₴</span><span>Застава: ${Math.round(property.price / 2)} ₴</span><span>Викуп: ${Math.round(property.price * .55)} ₴</span></div>
                ${property.owner && isMonopoly ? `<div class="quick-houses"><button class="warning" onclick="event.stopPropagation();removeHouse(${index})" ${canSell ? '' : 'disabled'}>−</button><div class="house-state">${property.houses === 5 ? '🏨 Готель' : `🏠 ${property.houses} / 4`}</div><button class="success" onclick="event.stopPropagation();${property.houses === 4 ? `addHotel(${index})` : `addHouse(${index})`}" ${canBuild ? '' : 'disabled'}>+</button></div>` : ''}
                <div class="property-actions">
                    <select class="wide" onchange="assignProperty(${index}, this.value, 'street')" ${players.length ? '' : 'disabled'}>
                        <option value="">— обрати власника —</option>
                        ${players.map(player => `<option value="${escapeHtml(player.name)}" ${property.owner === player.name ? 'selected' : ''}>${escapeHtml(player.name)}</option>`).join('')}
                    </select>
                    <button onclick="showPropertyCard(${index})">Картка</button>
                    ${property.owner ? `<button class="warning" onclick="toggleMortgage(${index}, 'street')" ${property.houses ? 'disabled' : ''}>${property.mortgaged ? 'Викупити' : 'Закласти'}</button><button class="danger wide" onclick="freeProperty(${index}, 'street')">Звільнити</button>` : ''}
                </div>
            </div>
        </article>`;
    }).join('');
}

// Відображення вокзалів
function renderRailroads() {
    const div = document.getElementById("railroads");
    div.innerHTML = renderSpecialProperties(railroads, 'railroad');
}

// Відображення комунікацій
function renderUtilities() {
    const div = document.getElementById("utilities");
    div.innerHTML = renderSpecialProperties(utilities, 'utility');
}

function renderSpecialProperties(collection, type) {
    return collection.map((item, index) => {
        const ownerColor = item.owner ? getPlayerColor(item.owner) : '#9aa29e';
        const rent = type === 'railroad' && !item.mortgaged ? calculateRailroadRent(item.owner) : 0;
        const cardAction = type === 'railroad' ? `showRailroadCard(${index})` : `showUtilityCard(${index})`;
        const count = type === 'railroad' ? countRailroadsByOwner(item.owner) : countUtilitiesByOwner(item.owner);
        const rentText = type === 'railroad' ? `${rent} ₴` : (item.owner && !item.mortgaged ? (count === 2 ? '×10' : '×4') : '—');
        return `<article class="property-item ${item.mortgaged ? 'mortgaged' : ''}" style="border-left-color:${item.color}">
            <div class="property-summary" onclick="this.parentElement.classList.toggle('open')">
                <div class="property-title"><div class="property-name">${item.icon} ${escapeHtml(item.name)} ${item.mortgaged ? '<span class="mortgage-badge">ЗАКЛАДЕНО</span>' : ''}</div>
                <div class="property-meta"><span><i class="owner-dot" style="background:${ownerColor}"></i>${item.owner ? escapeHtml(item.owner) : 'Вільна'}</span><span>Ціна ${item.price} ₴</span></div></div>
                <div class="property-rent"><span>оренда</span><strong>${rentText}</strong></div>
            </div>
            <div class="property-details"><div class="property-meta"><span>Застава: ${item.mortgage} ₴</span><span>Викуп: ${Math.round(item.mortgage * 1.1)} ₴</span>${item.owner ? `<span>У власника: ${count}</span>` : ''}</div>
            <div class="property-actions"><select class="wide" onchange="assignProperty(${index}, this.value, '${type}')"><option value="">— обрати власника —</option>${players.map(player => `<option value="${escapeHtml(player.name)}" ${item.owner === player.name ? 'selected' : ''}>${escapeHtml(player.name)}</option>`).join('')}</select><button onclick="${cardAction}">Картка</button>${item.owner ? `<button class="warning" onclick="toggleMortgage(${index}, '${type}')">${item.mortgaged ? 'Викупити' : 'Закласти'}</button><button class="danger wide" onclick="freeProperty(${index}, '${type}')">Звільнити</button>` : ''}</div></div>
        </article>`;
    }).join('');
}

// Привласнити власність гравцю
function assignProperty(index, ownerName, type) {
    let item;
    let collection;
    
    if (type === 'street') {
        collection = properties;
    } else if (type === 'railroad') {
        collection = railroads;
    } else {
        collection = utilities;
    }
    
    item = collection[index];
    
    const previousOwner = item.owner;
    if (ownerName === "") {
        item.owner = null;
        if (type === 'street') {
            item.houses = 0;
        } else {
            item.mortgaged = false;
        }
    } else {
        item.owner = ownerName;
        if (previousOwner && previousOwner !== ownerName) {
            item.mortgaged = false;
            if (type === 'street') item.houses = 0;
        }
    }
    
    updateGameAndSave();
}

// Звільнити власність
function freeProperty(index, type) {
    if (type === 'street') {
        properties[index].owner = null;
        properties[index].houses = 0;
        properties[index].mortgaged = false;
    } else if (type === 'railroad') {
        railroads[index].owner = null;
        railroads[index].mortgaged = false;
    } else {
        utilities[index].owner = null;
        utilities[index].mortgaged = false;
    }
    updateGameAndSave();
}

// Додати будинок
function addHouse(index) {
    const property = properties[index];
    const group = properties.filter(item => item.group === property.group);
    const minHouses = Math.min(...group.map(item => item.houses));
    if (property.mortgaged) return alert('Спочатку викупіть вулицю');
    if (group.some(item => item.mortgaged)) return alert('Не можна будувати, поки одна з вулиць групи закладена');
    if (property.houses < 4 && property.houses === minHouses && checkMonopoly(property.group, property.owner)) {
        property.houses++;
        updateGameAndSave();
    } else alert('Будинки треба розподіляти рівномірно по всій кольоровій групі');
}

// Видалити будинок
function removeHouse(index) {
    const property = properties[index];
    const group = properties.filter(item => item.group === property.group);
    const maxHouses = Math.max(...group.map(item => item.houses));
    if (property.houses > 0 && property.houses === maxHouses) {
        property.houses--;
        updateGameAndSave();
    } else alert('Будинки треба продавати рівномірно по всій кольоровій групі');
}

// Додати готель
function addHotel(index) {
    const property = properties[index];
    const group = properties.filter(item => item.group === property.group);
    if (property.houses === 4 && group.every(item => item.houses >= 4 && !item.mortgaged) && checkMonopoly(property.group, property.owner)) {
        property.houses = 5;
        updateGameAndSave();
    } else alert('Для готелю на кожній вулиці групи має бути по 4 будинки');
}

// Змінити статус залогу
function toggleMortgage(index, type) {
    let item;
    
    if (type === 'street') {
        item = properties[index];
        if (!item.mortgaged && item.houses > 0) return alert('Спочатку продайте всі будинки');
        const group = properties.filter(property => property.group === item.group);
        if (!item.mortgaged && group.some(property => property.houses > 0)) return alert('Спочатку продайте будинки з усієї кольорової групи');
    } else if (type === 'railroad') {
        item = railroads[index];
    } else {
        item = utilities[index];
    }
    
    item.mortgaged = !item.mortgaged;
    updateGameAndSave();
}

// Перевірити монополію
function checkMonopoly(group, owner) {
    if (!owner) return false;
    
    const groupProperties = properties.filter(p => p.group === group);
    const ownedProperties = groupProperties.filter(p => p.owner === owner);
    
    return groupProperties.length === ownedProperties.length;
}

// Підрахувати кількість вокзалів у власника
function countRailroadsByOwner(ownerName) {
    return railroads.filter(r => r.owner === ownerName && !r.mortgaged).length;
}

// Підрахувати кількість комунікацій у власника
function countUtilitiesByOwner(ownerName) {
    return utilities.filter(u => u.owner === ownerName && !u.mortgaged).length;
}

// Розрахувати оренду за вокзал
function calculateRailroadRent(ownerName) {
    if (!ownerName) return 0;
    
    const count = countRailroadsByOwner(ownerName);
    
    switch(count) {
        case 1: return 25;
        case 2: return 50;
        case 3: return 100;
        case 4: return 200;
        default: return 0;
    }
}

// Розрахувати оренду за комунікацію (при заданій сумі кубиків)
function calculateUtilityRent(ownerName, diceSum) {
    if (!ownerName || !diceSum) return 0;
    
    const count = countUtilitiesByOwner(ownerName);
    
    if (count === 1) {
        return diceSum * 4;
    } else if (count === 2) {
        return diceSum * 10;
    }
    
    return 0;
}

// Розрахувати поточну оренду для вулиці
function calculateCurrentRent(property) {
    if (!property.owner || property.mortgaged) return 0;
    
    const isMonopoly = checkMonopoly(property.group, property.owner);
    
    // Якщо монополія і немає будинків - оренда подвоюється
    if (isMonopoly && property.houses === 0) {
        return property.rent[0] * 2;
    }
    
    // З будинками/готелями
    return property.rent[property.houses];
}

// Отримати колір гравця
function getPlayerColor(playerName) {
    const player = players.find(p => p.name === playerName);
    return player ? player.color : '#cccccc';
}

// Витягнути транспортну картку
function drawTransportCard() {
    // Фільтруємо невикористані карти
    const availableCards = transportCards.filter((card, index) => !transportCardsUsed.includes(index));
    
    if (availableCards.length === 0) {
        // Якщо всі карти використані, скидаємо
        transportCardsUsed = [];
        drawTransportCard();
        return;
    }
    
    const randomIndex = Math.floor(Math.random() * availableCards.length);
    const card = availableCards[randomIndex];
    
    // Знаходимо індекс оригінальної карти
    const originalIndex = transportCards.findIndex(c => c === card);
    transportCardsUsed.push(originalIndex);
    
    // Зберігаємо стан карт
    saveGame();
    
    // Створюємо інформацію про картку
    let cardInfo = `
        <div style="text-align: left;">
            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; margin: -25px -25px 25px -25px;">

                    1. Можна поїхати на будь-яку клітинку поля<br>

        resultDiv.innerHTML = "<div style='text-align: center; padding: 20px; color: #666;'>Оберіть власність для розрахунку оренди</div>";

// Скинути гру
function resetGame() {
    if (confirm("Розпочати нову гру? Усі поточні дані будуть втрачені.")) {
        clearSavedGame();
        startNewGame();
    }
}

// Оновити статистику
function updateStats() {
    // Статистика гравців
    const playerStatsDiv = document.getElementById("playerStats");
    if (players.length > 0) {
        let statsHTML = `<div class="stats-grid">`;
        players.forEach(player => {
            const playerStreets = properties.filter(p => p.owner === player.name);
            const playerRailroads = railroads.filter(r => r.owner === player.name && !r.mortgaged);
            const playerUtilities = utilities.filter(u => u.owner === player.name && !u.mortgaged);
            
            statsHTML += `
                <div class="stat-card">
                    <div style="color: ${player.color}; font-weight: 800; margin-bottom: 10px;">${player.name}</div>
                    <div class="stat-value">${player.money} ₴</div>
                    <div class="stat-label">🏘️ ${playerStreets.length} | 🚂 ${playerRailroads.length} | ⚡ ${playerUtilities.length}</div>
                </div>
            `;
        });
        statsHTML += `</div>`;
        playerStatsDiv.innerHTML = statsHTML;
    }
    
    // Статистика вулиць
    const streetStatsDiv = document.getElementById("streetStats");
    const ownedStreets = properties.filter(p => p.owner).length;
    const totalHouses = properties.reduce((sum, prop) => sum + (prop.houses < 5 ? prop.houses : 0), 0);
    const totalHotels = properties.filter(prop => prop.houses === 5).length;
    
    streetStatsDiv.innerHTML = `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Всього</div>
                <div class="stat-value">${properties.length}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Зайнято</div>
                <div class="stat-value">${ownedStreets}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Будинки</div>
                <div class="stat-value">${totalHouses}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Готелі</div>
                <div class="stat-value">${totalHotels}</div>
            </div>
        </div>
    `;
    
    // Статистика вокзалів
    const railroadStatsDiv = document.getElementById("railroadStats");
    const ownedRailroads = railroads.filter(r => r.owner).length;
    const mortgagedRailroads = railroads.filter(r => r.mortgaged).length;
    
    railroadStatsDiv.innerHTML = `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Всього</div>
                <div class="stat-value">${railroads.length}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Зайнято</div>
                <div class="stat-value">${ownedRailroads}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Вільних</div>
                <div class="stat-value">${railroads.length - ownedRailroads}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Закладено</div>
                <div class="stat-value">${mortgagedRailroads}</div>
            </div>
        </div>
    `;
    
    // Статистика комунікацій
    const utilityStatsDiv = document.getElementById("utilityStats");
    const ownedUtilities = utilities.filter(u => u.owner).length;
    const mortgagedUtilities = utilities.filter(u => u.mortgaged).length;
    
    utilityStatsDiv.innerHTML = `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Всього</div>
                <div class="stat-value">${utilities.length}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Зайнято</div>
                <div class="stat-value">${ownedUtilities}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Вільних</div>
                <div class="stat-value">${utilities.length - ownedUtilities}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Закладено</div>
                <div class="stat-value">${mortgagedUtilities}</div>
            </div>
        </div>
    `;
    
    // Загальна статистика гри
    const gameStatsDiv = document.getElementById("gameStats");
    
    // Знаходимо найбагатшого гравця
    let richestPlayer = null;
    let maxWealth = 0;
    
    players.forEach(player => {
        const playerStreets = properties.filter(p => p.owner === player.name);
        const playerRailroads = railroads.filter(r => r.owner === player.name && !r.mortgaged);
        const playerUtilities = utilities.filter(u => u.owner === player.name && !u.mortgaged);
        const streetValue = playerStreets.reduce((sum, prop) => sum + prop.price, 0);
        const railroadValue = playerRailroads.reduce((sum, rr) => sum + rr.price, 0);
        const utilityValue = playerUtilities.reduce((sum, util) => sum + util.price, 0);
        const totalWealth = player.money + streetValue + railroadValue + utilityValue;
        
        if (totalWealth > maxWealth) {
            maxWealth = totalWealth;
            richestPlayer = player.name;
        }
    });
    
    // Знаходимо монополії
    const monopolies = [];
    const groups = ["brown", "lightblue", "pink", "orange", "red", "yellow", "green", "blue"];
    
    groups.forEach(group => {
        const groupProperties = properties.filter(p => p.group === group);
        if (groupProperties.length > 0) {
            const owners = [...new Set(groupProperties.map(p => p.owner).filter(o => o))];
            if (owners.length === 1 && owners[0]) {
                monopolies.push({
                    group: groupProperties[0].name.split(" ")[0], 
                    owner: owners[0], 
                    color: groupProperties[0].color,
                    fullGroupName: getGroupName(group)
                });
            }
        }
    });
    
    gameStatsDiv.innerHTML = `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Найбагатший</div>
                <div class="stat-value">${richestPlayer || "-"}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Монополій</div>
                <div class="stat-value">${monopolies.length}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Будинків</div>
                <div class="stat-value">${totalHouses}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Готелів</div>
                <div class="stat-value">${totalHotels}</div>
            </div>
        </div>
    `;
}

// Отримати назву групи за її ключем
function getGroupName(groupKey) {
    const groupNames = {
        'brown': 'Коричнева',
        'lightblue': 'Блакитна', 
        'pink': 'Рожева',
        'orange': 'Помаранчева',
        'red': 'Червона',
        'yellow': 'Жовта',
        'green': 'Зелена',
        'blue': 'Синя'
    };
    return groupNames[groupKey] || groupKey;
}

// Оновити гру і зберегти
function updateGameAndSave() {
    updateGame();
    saveGame();
}

// Оновити всю гру
function updateGame() {
    renderStreets();
    renderRailroads();
    renderUtilities();
    updateStats();
    populateRentCalculator();
}

// Ініціалізація при завантаженні
window.onload = init;

// Автозбереження при закритті сторінки
window.addEventListener('beforeunload', function(e) {
    saveGame();
});

// Автозбереження при зміні вмісту
document.addEventListener('input', function(e) {
    // Автозбереження тільки для певних елементів
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
        // Затримка, щоб уникнути занадто частого збереження
        setTimeout(saveGame, 1000);
    }
});
</script>
