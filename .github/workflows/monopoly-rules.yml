name: Monopoly rules and multiplayer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Monopoly rules
        run: node tests/rules.test.cjs
      - name: Validate 5-player synchronized room
        run: node tests/online-sync.test.cjs
